[package]
name = "vue_shaker_engine"
version = "0.0.0"
edition = "2024"
publish = false
description = "Rust engine for vue-shaker, built on the vize Vue toolchain (Stage A)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Build the WASM entry (`wasm-pack build engine-rs --target nodejs`).
wasm = ["dep:wasm-bindgen"]

[dependencies]
# vize crates (the Rust Vue toolchain) by path — they resolve their own
# `.workspace` inheritance against the sibling vize repo's workspace.
# `default-features = false` drops the `native` (LightningCSS) feature, which SFC
# block parsing does not need and which complicates a WASM build.
vize_atelier_sfc = { path = "../../../../vize/crates/vize_atelier_sfc", default-features = false }
vize_armature = { path = "../../../../vize/crates/vize_armature" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[[bin]]
name = "vue-shaker-rs"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
